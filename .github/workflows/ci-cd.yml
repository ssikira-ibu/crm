name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # On PRs: cancel superseded runs per ref.
  # On push to main: serialize deploys so two merges in quick succession don't race.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace @crm/shared

      - name: Backend — prisma generate
        run: npm run db:generate --workspace @crm/backend

      - name: Backend — typecheck
        run: npm run build --workspace @crm/backend

      - name: Backend — test
        run: npm test --workspace @crm/backend

      - name: Agent — typecheck
        run: npm run build --workspace @crm/agent

      - name: Frontend — lint
        run: npm run lint --workspace @crm/frontend

      - name: Frontend — typecheck
        run: npm run typecheck --workspace @crm/frontend

      - name: Frontend — build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters
          S2S_JWT_SECRET: ci-s2s-secret-that-is-at-least-32-characters
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
        run: npm run build --workspace @crm/frontend

  build:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend, agent]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target }}/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # NEXT_PUBLIC_* vars are inlined into the client bundle at build time
          # by Next.js. Setting them only at runtime (compose env) leaves the
          # browser bundle empty. The frontend Dockerfile accepts matching ARGs.
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml
            Caddyfile

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,Caddyfile
          target: ~/crm

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/crm

            # Source production env
            set -a && source .env && set +a
            export IMAGE_PREFIX="${IMAGE_PREFIX}"

            # Capture previous tag for rollback (falls back to 'latest' on first deploy)
            PREVIOUS_TAG="$(cat .last_deployed_tag 2>/dev/null || echo latest)"
            export IMAGE_TAG="${IMAGE_TAG}"

            # Login to GHCR
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Pull new images (while old containers keep serving)
            docker compose -f docker-compose.prod.yml pull backend frontend agent

            # Ensure caddy and infrastructure are up
            docker compose -f docker-compose.prod.yml up -d caddy tunnel db redis

            # Rolling deploy each service: scale up new, wait healthy, remove old
            rolling_deploy() {
              local service=$1
              echo "Rolling deploy: ${service}"

              # Get current container ID before scaling
              OLD_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q "${service}" | head -1)

              # Scale to 2 — new container starts alongside old
              docker compose -f docker-compose.prod.yml up -d --no-recreate --scale "${service}=2" "${service}"

              # Wait for the new container to become healthy (up to 120s)
              echo "Waiting for new ${service} container to be healthy..."
              for i in $(seq 1 60); do
                NEW_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q "${service}" | grep -v "${OLD_CONTAINER}" | head -1)
                if [ -n "${NEW_CONTAINER}" ]; then
                  HEALTH=$(docker inspect --format='{{.State.Health.Status}}' "${NEW_CONTAINER}" 2>/dev/null || echo "starting")
                  if [ "${HEALTH}" = "healthy" ]; then
                    echo "New ${service} container is healthy"
                    # Stop old container
                    if [ -n "${OLD_CONTAINER}" ]; then
                      docker stop "${OLD_CONTAINER}" && docker rm "${OLD_CONTAINER}"
                    fi
                    # Scale back to 1
                    docker compose -f docker-compose.prod.yml up -d --no-recreate --scale "${service}=1" "${service}"
                    return 0
                  fi
                fi
                sleep 2
              done

              echo "New ${service} container failed to become healthy — rolling back"
              # Remove the failed new container
              if [ -n "${NEW_CONTAINER}" ]; then
                docker stop "${NEW_CONTAINER}" 2>/dev/null && docker rm "${NEW_CONTAINER}" 2>/dev/null
              fi
              docker compose -f docker-compose.prod.yml up -d --no-recreate --scale "${service}=1" "${service}"
              return 1
            }

            # Deploy backend first (frontend depends on it)
            rolling_deploy backend || {
              echo "Backend deploy failed — aborting"
              exit 1
            }

            # Deploy agent
            rolling_deploy agent || {
              echo "Agent deploy failed — aborting"
              exit 1
            }

            # Deploy frontend last
            rolling_deploy frontend || {
              echo "Frontend deploy failed — aborting"
              exit 1
            }

            # Record successful tag for next rollback
            echo "${IMAGE_TAG}" > .last_deployed_tag

            echo "Deploy successful — zero downtime"
            docker image prune -f
