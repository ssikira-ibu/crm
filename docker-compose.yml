services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_dev
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    expose:
      - "3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://crm_user:crm_password@db:5432/crm_dev?schema=public
      PORT: "3000"
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    command: >
      sh -c "cd /app/packages/shared && npx tsc && cd /app/backend && npx prisma generate && npx prisma migrate deploy && npx tsx watch src/index.ts"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: development
      API_URL: http://backend:3000
      AGENT_URL: http://agent:3002
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/next.config.ts:/app/frontend/next.config.ts:ro
      - ./packages/shared/src:/app/packages/shared/src
      - type: bind
        source: ./firebase-service-account.json
        target: /app/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      target: development
    expose:
      - "3002"
    environment:
      PORT: "3002"
      BACKEND_URL: http://backend:3000
      NODE_ENV: development
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEFAULT_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      CORS_ORIGIN: ${AGENT_CORS_ORIGIN:-http://localhost:3001}
    volumes:
      - ./agent/src:/app/agent/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    command: >
      sh -c "cd /app/packages/shared && npx tsc && cd /app/agent && npx tsx watch src/index.ts"

volumes:
  pgdata:
